<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %}</title>
  <meta property="fb:app_id" content="YOUR_APP_ID" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  {% block css %}{% endblock %}
</head>
<body>
  <!-- Facebook root + SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v23.0&appId=1292221232280352&autoLogAppEvents=1">
  </script>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/shop">INDIA-CART</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
        aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="/shop">Homee</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop/tracker">Tracker</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop/contact">Contact Us</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        <button type="button" class="btn btn-secondary mx-2" id="popcart" data-bs-container="body"
          data-bs-toggle="popover" title="Cart" data-bs-placement="bottom" data-bs-html="true">
          <img src="https://cdn-icons-png.flaticon.com/512/107/107831.png" width="20" style="margin-right: 5px;">
          (<span id="cart">0</span>)
        </button>
         <!-- Button to trigger SignUp modal -->
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signUpmodal">
        SignUp
      </button>
      </div>
    </div>
  </nav>

  <!-- SignUp Modal -->
<div class="modal fade" id="signUpmodal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Create Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form method="POST" action="/signup/">

          <!-- Full Name -->
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="confirm_password" required>
          </div>

          <!-- Role -->
          <div class="mb-3">
            <label class="form-label">Register As</label>
            <select class="form-select" name="role">
              <option value="buyer">Buyer</option>
              <option value="seller">Seller</option>
            </select>
          </div>

          <!-- Terms -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" required>
            <label class="form-check-label">
              I agree to Terms & Conditions
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Sign Up
          </button>

        </form>
      </div>

    </div>
  </div>
</div>

  {% block body %}{% endblock %}

  <!-- Scripts -->
  <script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  {% block js %}{% endblock %}
</body>
</html>
